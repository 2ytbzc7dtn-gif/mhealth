<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Brain Capacity</title>

    <link rel="stylesheet" href="css/main.css">

    <script src="./js/vendor/jquery-3.3.1.min.js"></script>
    <script src="./js/vendor/gsap.min.js"></script>
    <script src="./js/main.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.cdnfonts.com/css/new-walt-disney-font" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
</head>

<body>

    <!-- AUDIO -->
    <audio id="backgroundMusic" controls loop autoplay>
        <source src="./ybyrayy-empty-reversed.mp3" type="audio/mp3">
    </audio>

    <audio id="clickSound" src="./boop.mp3"></audio>
    <audio id="clickSounds" src="./mouse-click.mp3"></audio>
    <audio id="hoverSounds" src="./mouse-click.mp3"></audio>

    <!-- PRELOADER -->
    <img id="loading" src="./images/new/loading-gif.gif" alt="loading...">

    <!-- BEGIN BUTTON -->
    <div id="btnContainer">

        <img class="stars" src="">

        <a id="begin" href="#screen1">
            Enter Your Mind
        </a>

        <img class="stars2" src="">

    </div>

    <!-- MAIN -->
    <main>

        <!-- SCREEN 1 -->
        <section id="screen1">

            <img class="bg" src="./images/new/bg.png">

            <h1 class="begin1">Start Presentation</h1>

            <img class="human" src="./images/new/human-brain.png">

            <img class="cap" src="./images/new/capacity.png">

            <img class="brain" src="./images/new/brain1.png">

        </section>

        <!-- SCREEN 2 -->
        <section id="screen2">

            <img class="memory" src="./images/new/memory.png">

            <img class="hoverlegend" src="./images/new/legend.png">

            <img class="tri3" src="./images/new/triangle-1.png">

            <img class="tri2" src="./images/new/triangle-1-2.png">

            <img class="tri1" src="./images/new/triangle-1-1.png">

            <img class="robot1" src="./images/new/bot1.png">

            <img class="bg2" src="./images/new/gradient-fill-1.png">

            <img class="rect" src="./images/new/rectangle-1.png">

            <img class="short" src="./images/new/short-term-1hr.png">

            <img class="long" src="./images/new/long-term-24hrs.png">

            <img class="number" src="./images/new/perc.png">

            <div id="ele9" class="ele eleHover">

                <p class="pos" onclick="playClickSounds()">C</p>

                <div id="bar1" class="bars">
                    70%
                </div>

                <div id="bar2" class="bars">
                    50%
                </div>

            </div>

            <div id="ele8" onclick="playHoverSounds()">
                <p>H</p>
            </div>

            <div id="ele8hover" class="ele">
                <img src="./images/new/pills1.png">
            </div>

            <div id="ele10">
                <p>H</p>
            </div>

            <div id="ele10hover" class="ele10">
                <img src="./images/new/average.png">
            </div>

        </section>

        <!-- SCREEN 3 -->
        <section id="screen3">

            <div id="ele7">
                <p>C</p>
            </div>

            <div id="ele6">
                <p>C</p>
            </div>

            <div id="ele5">
                <p>C</p>
            </div>

            <div id="ele4">
                <p>C</p>
            </div>

            <div class="emotions-container">

                <img class="fear" src="./images/new/fear.png">

                <img class="anger" src="./images/new/anger.png">

                <img class="sad" src="./images/new/sadness.png">

                <img class="happy" src="./images/new/happiness.png">

                <img class="brain4" src="./images/new/fear1.png">

                <img class="brain3" src="./images/new/sadness1.png">

                <img class="brain2" src="./images/new/anger1.png">

                <img class="brain1" src="./images/new/happiness1.png">

            </div>

            <img class="mainbrain" src="./images/new/mainbrain-1.png">

            <img class="bot3" src="./images/new/bot2.png">

            <img class="title3" src="./images/new/emotions.png">

            <img class="bg2" src="./images/new/gradient-fill-1.png">

            <img class="hoverlegend3" src="./images/new/legend.png">

        </section>

        <!-- SCREEN 4 -->
        <section id="screen4">

            <div class="heart-container">

                <img class="hearts" src="./images/new/hearts.gif">

                <div class="ele1">C</div>

            </div>

            <div class="love">

                <h3>
                    <span>Love</span> and
                    <span>attraction</span>
                    produces
                    <span>oxytocin,</span>
                    mixed with two chemicals...
                </h3>

            </div>

            <img class="hoverlegend4" src="./images/new/legend.png">

            <img class="bg" src="./images/new/bg.png">

            <img class="bot4" src="./images/new/bot3.png">

            <img class="title4" src="./images/new/love.png">

        </section>

        <!-- SCREEN 5 -->
        <section id="screen5">

            <img class="hoverlegend6" src="./images/new/legend.png">

            <div class="sad-container">

                <img class="sads" src="./images/new/giphy.gif">

                <div class="ele2">C</div>

            </div>

            <img class="tris" src="./images/new/tris.png">

            <img class="floater3" src="./images/new/floater3.png">

            <img class="floater2" src="./images/new/floater2.png">

            <img class="quote" src="./images/new/much.png">

            <img class="title5" src="./images/new/abandonment.png">

            <img class="bot5" src="./images/new/untitled-artwork-3.png">

            <img class="bg" src="./images/new/bg.png">

        </section>

        <!-- SCREEN 6 -->
        <section id="screen6">

            <img class="breathe" src="./images/new/breathe.png">

            <img class="just" src="./images/new/just.png">

            <img class="cant" src="./images/new/that-cant-happen.png">

            <img class="explode" src="./images/new/explode.png">

            <img class="likeour" src="./images/new/like-our-brains-might.png">

            <img class="itfeels" src="./images/new/it-feels.png">

            <img class="sometimes" src="./images/new/sometimes.png">

            <img class="bg4" src="./images/new/bg1.png">

        </section>

    </main>

</body>

</html>
